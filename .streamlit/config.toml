[theme]
base = "light"
primaryColor = "#1D6B45"
backgroundColor = "#F7F8F3"
secondaryBackgroundColor = "#EEF2EC"
textColor = "#142019"
font = "sans serif"

[client]
# Visiteurs : pas de menu développeur ni de trace d'erreur à l'écran (les détails restent dans les journaux)
toolbarMode = "viewer"
showErrorDetails = "none"

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 25

[browser]
gatherUsageStats = false
